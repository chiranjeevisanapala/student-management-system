# Application logging configuration
logger:
  enable: true
  pretty_backtrace: true
  level: debug
  format: compact

# Web server configuration
server:
  port: 5150
  host: 127.0.0.1
  middlewares:
    cors:
      enable: true
      allow_origins:
        - "http://localhost:5173"
        - "http://127.0.0.1:5173"
        - "http://localhost:3000"
      allow_headers:
        - "accept"
        - "content-type"
        - "authorization"
      allow_methods:
        - "GET"
        - "POST"
        - "PUT"
        - "PATCH"
        - "DELETE"
        - "OPTIONS"

# Database configuration
database:
  uri: "<%= get_env(name='DATABASE_URL', default='postgres://postgres:postgres@127.0.0.1:5432/student_management_db') %>"
  enable_logging: false
  min_connections: 1
  max_connections: 10
  connect_timeout: 5000
  idle_timeout: 5000

# Authentication configuration
auth:
  jwt:
    secret: "<%= get_env(name='JWT_SECRET', default='student_management_super_secure_jwt_secret_key_2026_modern_portal') %>"
    expiration: 604800 # 7 days

workers:
  mode: ForegroundBlocking
